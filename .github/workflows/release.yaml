name: Release

on:
  push:
    tags: ['v*']
  # Manual runs exercise the whole signing pipeline without publishing.
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    # While signing secrets are unset, releases are built and published
    # locally with scripts/release.sh; the whole job no-ops so it can't
    # clobber a manually uploaded (signed) asset with an unsigned one.
    # scripts/setup-signing.sh uploads every secret this job reads.
    env:
      HAVE_CERT: ${{ secrets.CSC_LINK != '' }}
    steps:
      - name: Check signing secrets
        if: env.HAVE_CERT != 'true'
        run: echo "::warning::CSC_LINK not configured - skipping CI release (publish with scripts/release.sh)"

      - uses: actions/checkout@v4
        if: env.HAVE_CERT == 'true'

      - name: Import signing certificate
        if: env.HAVE_CERT == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.CSC_LINK }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/build.keychain-db
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$APPLE_CERTIFICATE" | base64 -d > cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Runners ship Apple's roots but not the intermediates; without them
          # codesign can't build a chain and reports the identity as unusable.
          # WWDR G3 issues development certs, the other two issue Developer ID.
          for ca in AppleWWDRCAG3 DeveloperIDCA DeveloperIDG2CA; do
            curl -fsSL "https://www.apple.com/certificateauthority/$ca.cer" -o "$ca.cer"
            security import "$ca.cer" -k "$KEYCHAIN" -T /usr/bin/codesign
            rm "$ca.cer"
          done
          security import cert.p12 -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm cert.p12
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build universal binary
        if: env.HAVE_CERT == 'true'
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Sign
        if: env.HAVE_CERT == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          BIN=.build/apple/Products/Release/xcode-hackatime
          codesign -f --options runtime --timestamp \
            -s "$APPLE_SIGNING_IDENTITY" \
            --identifier com.hackclub.hackatime.xcode-hackatime \
            "$BIN"
          codesign -dv --verbose=2 "$BIN" 2>&1 | grep -E "Authority|TeamIdentifier|flags"
          codesign --verify --strict "$BIN"
          "$BIN" version

      - name: Package and notarize
        if: env.HAVE_CERT == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          BIN=.build/apple/Products/Release/xcode-hackatime
          ZIP="xcode-hackatime-darwin-universal.zip"
          /usr/bin/ditto -c -k "$BIN" "$ZIP"
          # Notarization requires a Developer ID signature; skip cleanly while
          # releases are interim-signed with a development certificate.
          if codesign -dv --verbose=2 "$BIN" 2>&1 | grep -q "Authority=Developer ID Application"; then
            # notarytool exits 0 even when Apple returns "Invalid", so check
            # the status line rather than the exit code.
            xcrun notarytool submit "$ZIP" --wait \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_PASSWORD" | tee notary.log
            grep -q "status: Accepted" notary.log
          else
            echo "::warning::Not Developer ID signed - skipping notarization (curl installs still work)"
          fi
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Keep build output for manual runs
        if: env.HAVE_CERT == 'true' && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: xcode-hackatime-darwin-universal
          path: ${{ env.ZIP }}

      - name: Upload release asset
        if: env.HAVE_CERT == 'true' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ZIP" \
            --title "$GITHUB_REF_NAME" --generate-notes ||
          gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber
